<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>views harness</title>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('os.theme') || 'light'; } catch (e) {}
</script>
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/base.css">
<style>
  #hbar {
    height: var(--titlebar-h); flex: none; display: flex; align-items: center; gap: 6px;
    padding: 0 10px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  }
  #hbar .grow { flex: 1; }
  #shell { height: 100%; display: flex; flex-direction: column; }
  #main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; } /* stands in for the shell's .main-scroll */
</style>
</head>
<body>
<div id="shell">
  <div id="hbar">
    <span class="label" style="padding:0">views harness</span>
    <button class="btn sm" data-v="month">month</button>
    <button class="btn sm" data-v="week">week</button>
    <button class="btn sm" data-v="day">day</button>
    <button class="btn sm" data-v="journal">journal</button>
    <span class="grow"></span>
    <label class="mono-sm faint" for="hsrc">todo source</label>
    <select class="input sm" id="hsrc" style="width:230px">
      <option value="">default (settings)</option>
      <option value="7-scratchpad/views-test/tasks">sandbox folder</option>
      <option value="7-scratchpad/views-test/tasks/1-general-todo.md">sandbox single file</option>
      <option value="nowhere/0-tasks">missing path</option>
    </select>
    <span class="mono-sm faint" id="hstatus">writes outside 7-scratchpad/ are redirected</span>
    <button class="btn sm" id="htheme">theme</button>
  </div>
  <div id="main"></div>
</div>
<script type="module">
import { bridge } from '/src/bridge/index.js';
import { views, status } from '/src/registry.js';
import { initViews } from '/src/views/index.js';
import { setTaskSource } from '/src/views/tasks-index.js';
import { getSource, setSourceOverride, SOURCE_DEFAULTS } from '/src/views/sources-compat.js';

const SANDBOX_DIR = '7-scratchpad/views-test';
const SANDBOX_TASKS = `${SANDBOX_DIR}/tasks`;
const SANDBOX_JOURNAL = `${SANDBOX_DIR}/journal`;

// `?sandbox` points the two writing views at copies under 7-scratchpad/, so saving a journal
// entry or toggling a task can be exercised end to end without touching the real vault.
const q = new URLSearchParams(location.search);
if (q.has('sandbox')) {
  setSourceOverride('journal', SANDBOX_JOURNAL);
  setSourceOverride('todo', SANDBOX_TASKS);
}
// ?timetable= / ?plans= / ?systemsLog= / ?todo= / ?journal= / ?scratch= point one source
// elsewhere for this session, which is what the `sources` event does in the app.
for (const k of Object.keys(SOURCE_DEFAULTS)) if (q.has(k)) setSourceOverride(k, q.get(k));

// Safety net either way: nothing outside the scratch folder is ever written from here.
const guard = (p) => (String(p).startsWith('7-scratchpad/')
  ? p
  : `${SANDBOX_DIR}/redirected/${String(p).replace(/[\/ ]/g, '_')}`);
for (const m of ['writeText', 'appendText']) {
  const orig = bridge[m].bind(bridge);
  bridge[m] = (p, ...rest) => { const g = guard(p); if (g !== p) console.info('[harness] redirect', m, p, '->', g); return orig(g, ...rest); };
}

status.watch((all) => { document.getElementById('hstatus').textContent = all.map(s => s.text).join(' · ') || 'ok'; });

const main = document.getElementById('main');
let cur = null;
async function show(name) {
  if (cur) { try { views.get(cur).unmount(); } catch (e) { console.error(e); } }
  main.innerHTML = '';
  cur = name;
  document.querySelectorAll('#hbar [data-v]').forEach(b => b.classList.toggle('primary', b.dataset.v === name));
  location.hash = name;
  await views.get(name).mount(main);
}

await initViews();
document.querySelectorAll('#hbar [data-v]').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
document.getElementById('htheme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('os.theme', next); } catch (e) {}
});
// The sandbox lists are written on demand so no fixture is left lying in the vault between
// runs. Two files, so the Day view has two labelled groups to draw.
const FIXTURE = {
  '1-general-todo.md': `# General Tasks Todo List

- [ ] Sandbox overdue item \u{1F4C5} 2026-08-30 \u{23EB}
- [ ] Sandbox item due today \u{1F4C5} ${new Date().toISOString().slice(0, 10)}
  - [ ] A nested sandbox item
- [ ] Sandbox item with no date
- [x] Sandbox item already done \u{2705} 2026-09-05
`,
  '2-legal-todo.md': `# Legal Tasks Todo List

- [ ] Sandbox legal item with no date
- [ ] Sandbox legal item due today \u{1F4C5} ${new Date().toISOString().slice(0, 10)}
`,
};
async function seedTasks() {
  for (const [name, text] of Object.entries(FIXTURE)) {
    const p = `${SANDBOX_TASKS}/${name}`;
    if (!(await bridge.exists(p))) await bridge.writeText(p, text);
  }
}

const srcSel = document.getElementById('hsrc');
srcSel.value = q.get('todo') || '';
srcSel.addEventListener('change', async () => {
  const v = srcSel.value;
  if (v.startsWith(SANDBOX_TASKS)) await seedTasks();
  setTaskSource(null);                         // drop any direct override, the source wins
  setSourceOverride('todo', v || null);
  console.info('[harness] todo source ->', getSource('todo'));
});
if (q.has('sandbox')) await seedTasks();

bridge.on('fs', () => { const v = views.get(cur); if (v) v.refresh(); });
await show((location.hash || '#month').slice(1));
window.__views = views;
</script>
</body>
</html>
