# Ose Web's checks (docs/WEB.md): the web modules' tests, the build of `dist-web/` (the kernel
# bundles with `__OSE_WEB__` true, the shell, the service worker, the manifest), and the built
# folder end to end in Chromium. Vercel builds and serves `dist-web/` itself (vercel.json); this
# workflow publishes nothing. The desktop build is build.yml's and is not touched here.
name: web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The web modules run on the in-memory File System Access API (tests/stubs/fsa.js); a
      # failing test publishes nothing.
      - name: Test the web modules
        run: npx vitest run tests/web

      - name: Build Ose Web
        run: npm run build:web

      # The built folder itself, served statically, in Chromium over OPFS (tests/e2e/web.spec.js):
      # open, type, save, a change on disk, rename, trash, reload, offline.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test the built Ose Web end to end
        run: npx playwright test tests/e2e/web.spec.js
        env:
          OSE_WEB_DIST: dist-web
