# Builds Ose for Windows and macOS and publishes both.
#
# Windows is MSVC: that toolchain links WebView2Loader statically, so the result is one
# self-contained ose.exe with no DLL beside it. A local MinGW build is for development and is
# not what anyone downloads. macOS is Apple silicon: Ose.app, zipped with ditto, and signed with the
# stable self-signed identity from the repository's secrets when they exist (M51), ad hoc otherwise.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One build per ref. A newer push cancels the running one, so the rolling release is written
# once, by the last run, instead of two runs racing to recreate the same tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The save path, the serializer, the router and the dev bridge (vitest, H11). A failing
      # test stops the build: nothing that loses text is published.
      - name: Test the page
        run: npm test

      # checkJs over the save path and the kernel (tsconfig.json): zero errors, or no build.
      - name: Typecheck
        run: npm run typecheck

      # Biome with warnings as errors: the code stays clean.
      - name: Lint
        run: npm run lint

      # dist/: the shell and the four library bundles with their stylesheets beside it
      # (frontendDist), which the exe embeds.
      - name: Build the kernel bundles and the shell
        run: npm run build

      # The no-loss suite (H11): the app in Chromium over the browser dev server, on a temp copy
      # of a synthetic vault: typing, closing, failing writes, conflicts, and the bytes on disk
      # checked after each. Chromium comes from Playwright itself and exists on this runner only.
      - name: Install Chromium for the no-loss suite
        run: npx playwright install chromium

      - name: Test that nothing typed is lost
        run: npm run test:e2e

      - name: Keep the no-loss report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # The host's own tests: the atomic write with a held temp file, saveFile, the encodings,
      # drafts, the version tiers, the epoch, the windows' routing, outside files, ranges, the
      # hide rule, the trash, the local store, the watcher, and `bindings_are_current`: the
      # kernel's src/kernel/bridge/bindings.ts is exactly what the commands generate. They need
      # dist/, which `generate_context!` embeds.
      - name: Test the host
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # A warning fails the Windows build: the host is clean, and stays that way.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The standard layout: the shell and the library bundles in dist/, which the Tauri build
      # embeds. It must be whole.
      - name: Check the build
        shell: pwsh
        run: |
          $root = "dist"
          $want = @("index.html","main.js","ose/kernel.js","ose/editor.js","ose/planner.js","ose/ui.js","ose/ui.css","ose/editor.css","ose/planner.css")
          $missing = $want | Where-Object { -not (Test-Path "$root/$_") }
          if ($missing) { throw "$root is missing: $($missing -join ", "). Run npm run build." }
          Get-ChildItem -Recurse -Depth 1 $root | Select-Object FullName, Length | Format-Table

      # The stamp `--version` prints: the commit this build is, and the day, read at compile time.
      - name: Stamp the build
        shell: pwsh
        run: |
          "OSE_BUILD_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "OSE_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV

      # tauri:build resolves to `tauri build --no-bundle` on Windows: one self-contained
      # src-tauri/target/release/ose.exe, no installer.
      - name: Build the host
        run: npm run tauri:build

      - name: Stage ose.exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ose.exe"
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          Copy-Item $exe "$env:GITHUB_WORKSPACE/ose.exe" -Force
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      # `ose --version` is what a person runs to see what they have. It must say `ose 1.0.x`,
      # and it must say it from the binary this run is about to publish.
      - name: Version line
        shell: pwsh
        run: |
          $line = (& "$env:GITHUB_WORKSPACE/ose.exe" --version 2>&1 | Out-String).Trim()
          Write-Host "ose --version: $line"
          if ($line -notmatch '^ose 1\.\d+\.\d+ \(') { throw "unexpected --version line: $line" }

      - uses: actions/upload-artifact@v4
        with:
          name: ose-windows
          path: ose.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test the page
        run: npm test

      - name: Build the kernel bundles and the shell
        run: npm run build

      - name: Test the host
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Reported, not fatal, on macOS: its cfg branches are built nowhere else before this job.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Stamp the build
        run: |
          echo "OSE_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "OSE_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # M51: one stable identity, so macOS knows a new build for the same app and asks "Open
      # Anyway" once, not after every update. The identity is a self-signed code-signing
      # certificate Hassan made once (docs/HOST.md "Signing on macOS"), exported as a .p12 into
      # two secrets. It goes into a keychain of this run's own, and APPLE_SIGNING_IDENTITY names
      # it to tauri, which then signs with it instead of ad hoc. Without the secrets this step
      # does nothing and the bundle is signed ad hoc, as before.
      - name: Import the signing identity
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ]; then
            echo "no signing secrets: the bundle is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/ose-signing.keychain-db"
          kpass=$(uuidgen)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ose-signing.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/ose-signing.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/ose-signing.p12"
          # A self-signed identity is not trusted, so it is looked up without -v; its common
          # name is what codesign is given.
          identity=$(security find-identity -p codesigning "$keychain" | awk -F'"' 'NF > 2 { print $2; exit }')
          if [ -z "$identity" ]; then echo "::error::no code-signing identity in the .p12"; exit 1; fi
          echo "signing as: $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # tauri:build resolves to `tauri build --bundles app` on macOS (package.json): the .app and
      # nothing else. The runner is Apple silicon, so the host target is aarch64-apple-darwin.
      - name: Build the host
        run: npm run tauri:build

      - name: Locate Ose.app
        id: app
        run: |
          set -euo pipefail
          app=$(find src-tauri/target -maxdepth 6 -type d -name 'Ose.app' | head -n 1)
          if [ -z "$app" ]; then echo "::error::no Ose.app under src-tauri/target"; exit 1; fi
          echo "path=$app" >> "$GITHUB_OUTPUT"

      - name: Version line
        run: |
          set -euo pipefail
          line=$("${{ steps.app.outputs.path }}/Contents/MacOS/ose" --version)
          echo "ose --version: $line"
          case "$line" in ose\ 1.*) ;; *) echo "::error::unexpected --version line: $line"; exit 1 ;; esac

      # APPLE_SIGNING_IDENTITY (above) signs with the stable identity; without it
      # signingIdentity "-" in tauri.conf.json signs the bundle ad hoc. Without either only the
      # binary carries the linker's signature, and a downloaded Ose.app is refused as "damaged"
      # with no way past it. Signed, macOS instead says it could not verify the app and offers
      # Open Anyway in System Settings > Privacy & Security, once per identity.
      - name: Check the signature
        run: |
          codesign --verify --deep --strict --verbose=2 "${{ steps.app.outputs.path }}"
          codesign -dv "${{ steps.app.outputs.path }}" 2>&1 | grep -E '^(Authority|Signature|Identifier)' || true

      # ditto keeps the bundle's structure and attributes, which a plain zip drops. The zip is
      # unpacked again and checked, since what matters is the signature a download arrives with.
      - name: Package the app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" "$GITHUB_WORKSPACE/ose-macos-arm64.zip"
          check=$(mktemp -d)
          ditto -x -k "$GITHUB_WORKSPACE/ose-macos-arm64.zip" "$check"
          codesign --verify --deep --strict --verbose=2 "$check/Ose.app"

      - uses: actions/upload-artifact@v4
        with:
          name: ose-macos
          path: ose-macos-arm64.zip
          if-no-files-found: error

  # Only a push to main publishes. A workflow_dispatch on any ref builds and uploads the
  # artifacts above and stops there. A failed macOS build does not hold Windows back: the
  # release goes out with whatever built, and Windows must have.
  release:
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ose-windows

      - uses: actions/download-artifact@v4
        if: needs.macos.result == 'success'
        with:
          name: ose-macos

      # A release tag cannot be moved through the release API: the action would reuse the
      # existing tag and publish the asset against the old commit. The rolling release and its
      # tag are therefore deleted first and recreated at this commit. The cost is the previous
      # download count, which is the right trade for a rolling prerelease.
      - name: Retire the previous latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || echo "no existing release latest"
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" || echo "no existing tag latest"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: true
          target_commitish: ${{ github.sha }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            ose.exe
            ose-macos-arm64.zip
