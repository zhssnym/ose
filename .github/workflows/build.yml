# Builds ose.exe and publishes it.
#
# One job, Windows, MSVC: that toolchain links WebView2Loader statically, so the result is one
# self-contained file with no DLL beside it. A local MinGW build is for development and is not
# what anyone downloads. macOS is not built; the macOS code in the Rust sources stays, unbuilt.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# One build per ref. A newer push cancels the running one, so the rolling release is written
# once, by the last run, instead of two runs racing to recreate the same tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # dist-kernel/: the four bundles, the two stylesheets and shell/, which the exe embeds.
      - name: Build the kernel bundles and the shell
        run: npm run build

      - name: Check the build
        shell: pwsh
        run: |
          $missing = @('kernel.js','ui.js','md.js','ui.css','index.html','shell/index.html','shell/main.js') |
            Where-Object { -not (Test-Path "dist-kernel/$_") }
          if ($missing) { throw "dist-kernel is missing: $($missing -join ', '). Run npm run build." }
          Get-ChildItem dist-kernel | Select-Object Name, Length | Format-Table

      # The stamp `--version` prints: the commit this build is, and the day, read at compile time.
      - name: Stamp the build
        shell: pwsh
        run: |
          "OSE_BUILD_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "OSE_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV

      # tauri:build resolves to `tauri build --no-bundle` on Windows: one self-contained
      # src-tauri/target/release/ose.exe, no installer.
      - name: Build the host
        run: npm run tauri:build

      - name: Stage ose.exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ose.exe"
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          Copy-Item $exe "$env:GITHUB_WORKSPACE/ose.exe" -Force
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      # `ose --version` is what a person runs to see what they have. It must say `ose 1.0.x`,
      # and it must say it from the binary this run is about to publish.
      - name: Version line
        shell: pwsh
        run: |
          $line = (& "$env:GITHUB_WORKSPACE/ose.exe" --version 2>&1 | Out-String).Trim()
          Write-Host "ose --version: $line"
          if ($line -notmatch '^ose 1\.\d+\.\d+ \(') { throw "unexpected --version line: $line" }

      - uses: actions/upload-artifact@v4
        with:
          name: ose-windows
          path: ose.exe
          if-no-files-found: error

  # Only a push to main publishes. A workflow_dispatch on any ref builds and uploads the
  # artifact above and stops there.
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ose-windows

      # A release tag cannot be moved through the release API: the action would reuse the
      # existing tag and publish the asset against the old commit. The rolling release and its
      # tag are therefore deleted first and recreated at this commit. The cost is the previous
      # download count, which is the right trade for a rolling prerelease.
      - name: Retire the previous latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || echo "no existing release latest"
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" || echo "no existing tag latest"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: true
          target_commitish: ${{ github.sha }}
          draft: false
          fail_on_unmatched_files: true
          files: ose.exe
