# Ose's checks, on every push to main and every pull request: the lint, the typecheck, the unit
# tests, the build, and the browser suites (no-loss, Live, Ose Web) against that build in
# Chromium. Vercel builds and serves the site itself (vercel.json); this workflow publishes
# nothing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Biome with warnings as errors.
      - name: Lint
        run: npm run lint

      # checkJs over the set in tsconfig.json: zero errors.
      - name: Typecheck
        run: npm run typecheck

      # vitest: the serializer, the core, the editor, Live, reading, the planner, the shell and
      # src/host over the in-memory File System Access stub. A failing test publishes nothing.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The browser suites build their own copy into a temp folder (tests/e2e/prepare.mjs) and
      # run it over the origin's private file system as the vault.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser suites
        run: npm run test:e2e

      - name: Keep the browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
