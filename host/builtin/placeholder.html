<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>os</title>
<style>
  :root {
    --bg: #FAF9F5; --bg-2: #F2F0E8; --bg-3: #E7E4D9;
    --fg: #1A1917; --fg-3: #7D7A70; --border: #DDD9CC; --accent: #D97757;
    --font-mono: "Cascadia Mono", Consolas, "Courier New", monospace;
    --font-ui: "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1A1917; --bg-2:#211F1D; --bg-3:#2A2825; --fg:#EDEAE2; --fg-3:#8A867C; --border:#33312C; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 15px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .titlebar {
    height: 36px; flex: 0 0 36px; display: flex; align-items: center;
    background: var(--bg-2); border-bottom: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--fg-3);
    -webkit-user-select: none; user-select: none;
  }
  .mark { padding: 0 12px; color: var(--accent); }
  .drag { flex: 1 1 auto; height: 100%; }
  .wbtn {
    width: 46px; height: 100%; border: 0; background: transparent; color: var(--fg);
    display: grid; place-items: center; cursor: default;
  }
  .wbtn:hover { background: var(--bg-3); }
  .wbtn.close:hover { background: #C4462F; color: #fff; }
  main { flex: 1 1 auto; display: grid; place-items: center; text-align: center; padding: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
  p { margin: 4px 0; color: var(--fg-3); font-family: var(--font-mono); font-size: 12px; }
  code { background: var(--bg-3); border: 1px solid var(--border); padding: 1px 5px; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="mark">os</span>
    <div class="drag" id="drag"></div>
    <button class="wbtn" id="min" title="Minimise"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 5h8"/></svg></button>
    <button class="wbtn" id="max" title="Maximise"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="8" height="8"/></svg></button>
    <button class="wbtn close" id="close" title="Close"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l8 8M9 1l-8 8"/></svg></button>
  </div>
  <main>
    <div>
      <h1>UI not built</h1>
      <p>No Vite output was embedded in this build.</p>
      <p>Run <code>npm run build</code> in App/, then republish the host.</p>
    </div>
  </main>
<script>
  const wv = window.chrome && window.chrome.webview;
  let seq = 0;
  function call(cmd, ...args) { if (wv) wv.postMessage({ id: ++seq, cmd, args }); }
  document.getElementById('drag').addEventListener('mousedown', e => { if (e.button === 0) call('winStartDrag'); });
  document.getElementById('drag').addEventListener('dblclick', () => call('winMaximize'));
  document.getElementById('min').onclick = () => call('winMinimize');
  document.getElementById('max').onclick = () => call('winMaximize');
  document.getElementById('close').onclick = () => call('winClose');
</script>
</body>
</html>
