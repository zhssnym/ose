<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ose</title>
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<!-- The standard layout (docs/SHELL.md "How it loads"): the core's four bundles sit beside
     the shell in ./ose/, and this import map, the one inline script the page has, names them.
     The build hashes it into the page's CSP (vite.config.js); in the dev server it is inert,
     because Vite rewrites every ose:* import itself. The core's three sheets come first and the
     shell's follow them, and win; theme.css is last so that its token overrides win over
     everything. -->
<script type="importmap">{"imports":{"ose:core":"./ose/core.js","ose:editor":"./ose/editor.js","ose:views":"./ose/views.js","ose:ui":"./ose/ui.js"}}</script>
<link rel="stylesheet" href="./ose/ui.css">
<link rel="stylesheet" href="./ose/editor.css">
<link rel="stylesheet" href="./ose/views.css">
<link rel="stylesheet" href="./shell.css">
<link rel="stylesheet" href="./tree.css">
<link rel="stylesheet" href="./places.css">
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<div id="app"></div>
<!-- Every line of shell JavaScript is in a file: the CSP allows no inline script but the import
     map above. main.js loads boot-error.js as a module of its own, so a core that fails to
     load still leaves the error page. -->
<script type="module" src="./first-paint.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
