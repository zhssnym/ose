[package]
name = "ose"
version = "0.5.0"
description = "Ose"
authors = ["Hassan Shahir"]
edition = "2021"
rust-version = "1.85"

# The library holds every module; the binary is a thin entry point so `generate_handler!`
# can name commands by path (`ose::rpc`).
[lib]
name = "ose"
path = "src/lib.rs"

[[bin]]
name = "ose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Links the Windows application manifest into every target, not only the bins (build.rs).
# Already in the tree as tauri-build's own resource compiler; no new download.
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
# Native folder picker for choosing a vault (pickVault); used from Rust only, no JS package.
tauri-plugin-dialog = "2"
# One window per vault (S14). The official plugin: a second launch hands its argv to the running
# process and exits, and the callback below decides whether that means "focus me" or "open this
# other folder in the window you already have".
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
opener = "0.7"
percent-encoding = "2"
base64 = "0.22"
# The update check and the asset download (update.rs). The download cannot run in the webview:
# GitHub's signed asset host answers without a CORS header, so fetch() from the page is refused
# before a byte arrives. A small blocking client on a worker thread is all the host needs; rustls
# so the build never depends on a system OpenSSL, no default features so no gzip/compression
# crates ride along.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# sha256 of the downloaded asset against the digest the release API publishes; pure Rust, and
# already in the tree as a transitive dependency of tauri (no new download).
sha2 = "0.10"

# Shift held at launch forces the kernel's fallback page (docs/RICE.md step 3). Reading the
# key state is the one thing that needs a platform API: `GetAsyncKeyState` on Windows,
# `NSEvent.modifierFlags` on macOS. Both crates are already in the tree as transitive
# dependencies of tauri, so neither is a new download; both are named here because a direct
# `use` needs a direct dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
