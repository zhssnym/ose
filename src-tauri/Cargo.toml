[package]
name = "ose"
version = "1.0.0"
description = "Ose"
authors = ["Hassan Shahir"]
edition = "2021"
rust-version = "1.85"

# The library holds every module and every command (commands.rs); the binary is a thin entry
# point that registers them through the tauri-specta builder (bindings.rs).
[lib]
name = "ose"
path = "src/lib.rs"

[[bin]]
name = "ose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Links the Windows application manifest into every target, not only the bins (build.rs).
# Already in the tree as tauri-build's own resource compiler; no new download.
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
# Native folder picker for choosing a vault (pickVault); used from Rust only, no JS package.
tauri-plugin-dialog = "2"
# One window per vault (S14). The official plugin: a second launch hands its argv to the running
# process and exits, and the callback below decides whether that means "focus me" or "open this
# other folder in the window you already have".
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
# The watcher's debouncer (H9): pairs the two halves of a rename by file id on Windows and
# macOS, merges a burst into one change per path, and says when the backend dropped events.
notify-debouncer-full = "0.7"
# The walker behind `tree` and `search` (H16), with its own filters off: the one hide rule is
# hide.rs, and `.gitignore` means nothing to a vault.
ignore = "0.4"
# "Is this the same file?" by volume and file id, for a case-only rename on a volume that may
# or may not fold case (M50). Already in the tree under walkdir; naming it is no extra download.
same-file = "1"
trash = "5"
opener = "0.7"
percent-encoding = "2"
base64 = "0.22"
# The `log` facade, so Tauri's and notify's own records reach the persistent log (lib.rs
# `Records`) and notify's silent Windows unwatch becomes a watcher restart (H9). Already in the
# tree under tauri; naming it is no extra download. The rotation is ours (lib.rs), which is why
# tauri-plugin-log is not here.
log = "0.4"
# Typed host commands (L9, wave 3): one `#[tauri::command]` per operation, and the TypeScript
# bindings the kernel imports (`src/kernel/bridge/bindings.ts`) generated from the Rust types by
# `bindings::builder()`. A beta: pinned with `=`, as tauri-specta's own documentation requires.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
# The one error type every command answers (`HostError`, error.rs).
thiserror = "2"
# Updates on push: the app checks the latest GitHub release on launch, verifies its signature
# with the public key in tauri.conf.json, installs it and restarts (tauri-plugin-process).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# NFC names on macOS (M49): APFS hands back the NFD a Finder rename wrote, and a link typed on
# the keyboard is NFC; without one form the two never compare equal.
unicode-normalization = "0.1"
# Text in any encoding (M52): encoding_rs decodes and encodes the WHATWG encodings, chardetng
# guesses which one a file without a byte-order mark is in. Both Mozilla's, both pure Rust.
encoding_rs = "0.8"
chardetng = "1"

# Printing is WebView2's own (print.rs): `ICoreWebView2_7::PrintToPdf` writes the PDF and
# `ICoreWebView2_16::ShowPrintUI` opens the system dialog. Both crates are already in the tree
# under Tauri's own webview (wry depends on webview2-com 0.39, which depends on windows-core
# 0.62), so naming them here is no extra download: it only says out loud what the host uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Thin LTO and parallel codegen: a release builds in a fraction of the time of a full LTO,
# single-unit build, for a binary a little larger.
[profile.release]
lto = "thin"
strip = true
codegen-units = 16
opt-level = "s"
