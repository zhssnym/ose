[package]
name = "ose"
version = "1.0.0"
description = "Ose"
authors = ["Hassan Shahir"]
edition = "2021"
rust-version = "1.85"

# The library holds every module; the binary is a thin entry point so `generate_handler!`
# can name commands by path (`ose::rpc`).
[lib]
name = "ose"
path = "src/lib.rs"

[[bin]]
name = "ose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Links the Windows application manifest into every target, not only the bins (build.rs).
# Already in the tree as tauri-build's own resource compiler; no new download.
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
# Native folder picker for choosing a vault (pickVault); used from Rust only, no JS package.
tauri-plugin-dialog = "2"
# One window per vault (S14). The official plugin: a second launch hands its argv to the running
# process and exits, and the callback below decides whether that means "focus me" or "open this
# other folder in the window you already have".
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
opener = "0.7"
percent-encoding = "2"
base64 = "0.22"
# The sha256 of the import map the host injects into the page, which is how the CSP names that
# one inline script without allowing every other one (shell.rs). Pure Rust, and already in the
# tree as a transitive dependency of tauri, so it is no extra download.
sha2 = "0.10"

# Printing is WebView2's own (print.rs): `ICoreWebView2_7::PrintToPdf` writes the PDF and
# `ICoreWebView2_16::ShowPrintUI` opens the system dialog. Both crates are already in the tree
# under Tauri's own webview (wry depends on webview2-com 0.38, which depends on windows-core
# 0.61), so naming them here is no extra download: it only says out loud what the host uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
