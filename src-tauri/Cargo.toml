[package]
name = "ose"
version = "0.1.0"
description = "os editor"
authors = ["Hassan Shahir"]
edition = "2021"
rust-version = "1.77"

# The library holds every module; the binary is a thin entry point so `generate_handler!`
# can name commands by path (`ose::rpc`).
[lib]
name = "ose"
path = "src/lib.rs"

[[bin]]
name = "os"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Links the Windows application manifest into every target, not only the bins (build.rs).
# Already in the tree as tauri-build's own resource compiler; no new download.
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
# Native folder picker for choosing a vault (pickVault); used from Rust only, no JS package.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
opener = "0.7"
percent-encoding = "2"
base64 = "0.22"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
